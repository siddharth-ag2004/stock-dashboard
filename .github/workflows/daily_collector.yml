name: Daily NSE 52-Week High Collector

on:
  schedule:
    # 4:15 PM IST is 10:45 UTC. GitHub often drops a single busy cron slot
    # and never creates a run, so the later slots retry the same session.
    - cron: '45 10 * * 1-5' # 16:15 IST
    - cron: '20 12 * * 1-5' # 17:50 IST
    - cron: '20 14 * * 1-5' # 19:50 IST
    - cron: '50 16 * * 1-5' # 22:20 IST
  workflow_dispatch:

concurrency:
  group: nse-daily-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch the latest closed NSE session
        run: python collector.py --pr auto

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --cached --quiet; then
            echo "No database changes to commit"
            exit 0
          fi
          git commit -m "Auto-update: Daily NSE 52-week high data"
          # Streamlit Cloud deploys from master; keep it synchronized with main.
          git push origin HEAD:main
          git push origin HEAD:master
