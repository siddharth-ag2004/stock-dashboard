name: Daily NSE 52-Week High Collector

on:
  schedule:
    # 4:15 PM IST is 10:45 AM UTC (Runs Monday to Friday)
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch and Store Today's 52-Week Highs
        run: |
          python collector.py --fetch

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Auto-update: Daily NSE 52-Week High data [$(date -u +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
